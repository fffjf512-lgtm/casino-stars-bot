<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casino Stars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#e94560;--gold:#f5c518;--green:#00d26a;--red:#ff4757;--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--text:#fff;--text2:#666}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.screen{display:none;min-height:100vh;padding:0;padding-bottom:70px}
.screen.active{display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(0,210,106,.2)}50%{box-shadow:0 0 25px rgba(0,210,106,.5)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg2)}
.balance-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);padding:8px 14px;border-radius:20px;font-weight:bold;font-size:14px}
.balance-pill .icon{color:var(--gold);font-size:16px}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.add-btn:active{transform:scale(.9)}

.history-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.history-bar::-webkit-scrollbar{display:none}
.history-chip{flex-shrink:0;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:bold;border:1px solid transparent;animation:fadeIn .3s ease}
.history-chip.low{background:rgba(0,210,106,.1);color:var(--green);border-color:rgba(0,210,106,.2)}
.history-chip.mid{background:rgba(245,197,24,.1);color:var(--gold);border-color:rgba(245,197,24,.2)}
.history-chip.high{background:rgba(233,69,96,.1);color:var(--accent);border-color:rgba(233,69,96,.2)}

.game-area{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px}
.game-area canvas{position:absolute;top:0;left:0;width:100%;height:100%}

.multiplier-big{position:relative;z-index:10;font-size:64px;font-weight:900;text-align:center;transition:all .15s;font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(0,0,0,.5)}
.multiplier-big.waiting{color:var(--accent);animation:pulse 1s infinite}
.multiplier-big.flying{color:var(--green);text-shadow:0 0 30px rgba(0,210,106,.4)}
.multiplier-big.crashed{color:var(--red);animation:shake .4s ease}

.countdown-ring{position:absolute;z-index:10;width:160px;height:160px}
.countdown-ring svg{width:100%;height:100%}
.countdown-ring .bg{fill:none;stroke:rgba(255,255,255,.05);stroke-width:6}
.countdown-ring .progress{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;transform:rotate(-90deg);transform-origin:center}

.phase-label{position:relative;z-index:10;font-size:13px;color:var(--text2);margin-top:8px;letter-spacing:1px;text-transform:uppercase}

.controls{padding:16px;position:relative;z-index:10}
.bet-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.bet-chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.bet-chip{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:bold;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .2s;color:var(--text)}
.bet-chip.active{border-color:var(--accent);background:rgba(233,69,96,.12);color:var(--accent)}
.bet-chip:active{transform:scale(.95)}
.bet-input{width:70px;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--text);font-size:13px;text-align:center}

.auto-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.auto-label{font-size:12px;color:var(--text2);white-space:nowrap}
.auto-input{width:55px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--text);font-size:12px;text-align:center}
.auto-input:focus{outline:none;border-color:var(--accent)}

.main-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;color:#fff;transition:all .25s;position:relative;overflow:hidden}
.main-btn.place{background:linear-gradient(135deg,#2979ff,#2962ff);box-shadow:0 4px 20px rgba(41,121,255,.3)}
.main-btn.cashout{background:linear-gradient(135deg,var(--green),#00b85d);box-shadow:0 4px 20px rgba(0,210,106,.3);animation:glow 1.5s infinite}
.main-btn:active{transform:scale(.98)}
.main-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.main-btn .sub{display:block;font-size:11px;font-weight:normal;opacity:.7;margin-top:2px}

.players-list{padding:0 16px 16px}
.players-title{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.player-card{display:flex;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,.04);animation:slideUp .3s ease;border:1px solid rgba(255,255,255,.03)}
.player-card.cashed{border-color:rgba(0,210,106,.15);background:rgba(0,210,106,.05)}
.player-card.lost{border-color:rgba(255,71,87,.15);background:rgba(255,71,87,.05)}
.player-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;margin-right:10px;flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-bet{font-size:11px;color:var(--text2);margin-top:2px}
.player-amount{font-size:14px;font-weight:bold;text-align:right}
.player-amount.win{color:var(--green)}
.player-amount.lose{color:var(--red)}
.player-mult{font-size:11px;color:var(--text2);text-align:right}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,42,.97);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.nav-btn{background:none;border:none;color:#444;font-size:10px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-btn span{font-size:22px;transition:transform .2s}
.nav-btn.active span{transform:scale(1.1)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,210,106,.9);color:#fff;padding:12px 24px;border-radius:12px;font-weight:bold;z-index:200;transition:transform .4s cubic-bezier(.68,-.55,.27,1.55);backdrop-filter:blur(10px);font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(255,71,87,.9)}

.settings-section{padding:20px}
.settings-title{font-size:16px;font-weight:bold;margin-bottom:20px}
.settings-group{margin-bottom:16px}
.settings-label{font-size:13px;color:var(--text2);margin-bottom:8px;display:block}
.lang-btns{display:flex;gap:8px}
.lang-btn{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--text);font-size:14px;font-weight:bold;cursor:pointer;transition:all .2s;text-align:center}
.lang-btn.active{border-color:var(--accent);background:rgba(233,69,96,.12);color:var(--accent)}
.lang-btn:active{transform:scale(.97)}
.settings-info{font-size:12px;color:var(--text2);margin-top:20px;text-align:center;line-height:1.6}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="game-screen" class="screen active">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">Casino</span>
      <span style="color:var(--gold);font-weight:bold">Stars</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="balance-pill">
        <span class="icon">&#11088;</span>
        <span id="balance-display">0</span>
      </div>
      <button class="add-btn" onclick="showScreen('deposit-screen')">+</button>
    </div>
  </div>

  <div class="history-bar" id="history-bar"></div>

  <div class="game-area">
    <canvas id="rocket-canvas"></canvas>
    <div class="countdown-ring" id="countdown-ring" style="display:none">
      <svg viewBox="0 0 160 160">
        <circle class="bg" cx="80" cy="80" r="70"/>
        <circle class="progress" id="countdown-progress" cx="80" cy="80" r="70"/>
      </svg>
    </div>
    <div class="multiplier-big waiting" id="mult-display" style="display:none"></div>
    <div class="phase-label" id="phase-label" style="display:none"></div>
  </div>

  <div class="controls">
    <div class="bet-row">
      <div class="bet-chips">
        <button class="bet-chip active" onclick="setBet(this,10)">10</button>
        <button class="bet-chip" onclick="setBet(this,25)">25</button>
        <button class="bet-chip" onclick="setBet(this,50)">50</button>
        <button class="bet-chip" onclick="setBet(this,100)">100</button>
        <button class="bet-chip" onclick="setBet(this,250)">250</button>
      </div>
      <input class="bet-input" id="bet-input" type="number" value="10" min="10">
    </div>
    <div class="auto-row">
      <span class="auto-label">Auto cashout:</span>
      <input class="auto-input" id="auto-cashout" type="number" value="0" min="0" step="0.1" placeholder="off">
      <span class="auto-label">x</span>
    </div>
    <button class="main-btn place" id="main-btn" onclick="placeBet()">
      Make Bet
      <span class="sub">Place your bet for next round</span>
    </button>
  </div>

  <div class="players-list">
    <div class="players-title" data-i18n="players">Players this round</div>
    <div id="players-container"></div>
  </div>
</div>

<div id="deposit-screen" class="screen">
  <div class="top-bar">
    <button onclick="showScreen('game-screen')" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer">&larr;</button>
    <span style="font-weight:bold" data-i18n="deposit">Deposit Stars</span>
    <div></div>
  </div>
  <div style="padding:20px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <p style="color:var(--text2);margin-bottom:24px;text-align:center" data-i18n="payWith">Pay with real Telegram Stars</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px">
      <button onclick="depositStars(10)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">10&#11088;</button>
      <button onclick="depositStars(25)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">25&#11088;</button>
      <button onclick="depositStars(50)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">50&#11088;</button>
      <button onclick="depositStars(100)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">100&#11088;</button>
      <button onclick="depositStars(250)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">250&#11088;</button>
      <button onclick="depositStars(500)" style="padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">500&#11088;</button>
      <button onclick="depositStars(1000)" style="grid-column:span 2;padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--gold);font-size:18px;font-weight:bold;cursor:pointer">1000&#11088;</button>
    </div>
  </div>
</div>

<div id="settings-screen" class="screen">
  <div class="top-bar">
    <button onclick="showScreen('game-screen')" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer">&larr;</button>
    <span style="font-weight:bold">Settings</span>
    <div></div>
  </div>
  <div class="settings-section">
    <div class="settings-title" data-i18n="settings">Settings</div>
    <div class="settings-group">
      <span class="settings-label" data-i18n="language">Language</span>
      <div class="lang-btns">
        <button class="lang-btn active" onclick="setLang('ru',this)">RU</button>
        <button class="lang-btn" onclick="setLang('en',this)">EN</button>
      </div>
    </div>
    <div class="settings-info">
      Casino Stars v1.0<br>
      <span data-i18n="info">Minimum deposit: 10 Stars<br>Minimum bet: 10 Stars</span>
    </div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn active" onclick="showScreen('game-screen')"><span>&#127968;</span>Main</button>
  <button class="nav-btn" onclick="showScreen('deposit-screen')"><span>&#128176;</span>Deposit</button>
  <button class="nav-btn" onclick="showScreen('settings-screen')"><span>&#9881;</span>Settings</button>
</div>

<script>
let gamePhase='betting',gameMult=1,myBetPlaced=false,prevPhase='',bet=10,displayMult=1;
let candles=[],crashFlash=0,lang='ru';
let lastCandleMult=1,candleTimer=0;
const AVATAR_COLORS=['#e94560','#2979ff','#00d26a','#f5c518','#9c27b0','#ff6b35','#00bcd4','#e91e63'];

const i18n={
  ru:{
    settings:'Настройки',language:'Язык',
    info:'Мин. депозит: 10 Stars\nМин. ставка: 10 Stars',
    placeBet:'Сделать ставку',placeSub:'Поставить на следующий раунд',
    cashOut:'Забрать',cashSub:'Забрать выигрыш!',
    flying:'Летит... Забери до краша!',
    crashed:'Краш!',placeYourBets:'Сделайте ставки',
    nextRound:'Скоро раунд',players:'Игроки',
    deposit:'Депозит',payWith:'Оплата реальными Telegram Stars',
    waiting:'ОЖИД',minBet:'Мин. ставка 10 Stars',
    betPlaced:'Ставка: ',stars:' Stars',
    cashedOut:'Забрал на x',won:' Выиграл ',
    error:'Ошибка'
  },
  en:{
    settings:'Settings',language:'Language',
    info:'Min deposit: 10 Stars\nMin bet: 10 Stars',
    placeBet:'Place Bet',placeSub:'Bet for next round',
    cashOut:'Cash Out',cashSub:'Grab your winnings!',
    flying:'Flying... Cash out before crash!',
    crashed:'Crashed!',placeYourBets:'Place your bets',
    nextRound:'Next round soon',players:'Players',
    deposit:'Deposit',payWith:'Pay with real Telegram Stars',
    waiting:'WAIT',minBet:'Minimum bet is 10 Stars',
    betPlaced:'Bet placed: ',stars:' Stars',
    cashedOut:'Cashed out at x',won:' Won ',
    error:'Error'
  }
};

function setLang(l,btn){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyLang();
}

function applyLang(){
  const t=i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(t[k])el.textContent=t[k];
  });
  document.querySelector('.nav-btn:nth-child(1) span').nextSibling.textContent=lang==='ru'?'Главная':'Main';
  document.querySelector('.nav-btn:nth-child(2) span').nextSibling.textContent=t.deposit;
  document.querySelector('.nav-btn:nth-child(3) span').nextSibling.textContent=t.settings;
  updateMainBtn();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(id==='game-screen'){document.querySelectorAll('.nav-btn')[0].classList.add('active');initCanvas()}
  else if(id==='deposit-screen')document.querySelectorAll('.nav-btn')[1].classList.add('active');
  else if(id==='settings-screen')document.querySelectorAll('.nav-btn')[2].classList.add('active');
}

function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' error':'');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

function getTelegramUser(){
  if(window.Telegram&&window.Telegram.WebApp){const tg=window.Telegram.WebApp;tg.ready();tg.expand();return tg.initDataUnsafe?.user||null}
  return null;
}

let user=null;

async function init(){
  const tg=getTelegramUser();
  const uid=tg?tg.id:Date.now();
  const uname=tg?tg.first_name:'Player';
  const r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,username:uname})});
  user=await r.json();user.user_id=uid;user.username=uname;
  updateBalance();
  setInterval(pollGame,150);
  pollGame();
}

function updateBalance(){
  if(!user)return;
  const el=document.getElementById('balance-display');
  el.textContent=user.balance.toFixed(1);
}

function setBet(btn,v){
  bet=v;
  document.getElementById('bet-input').value=v;
  document.querySelectorAll('.bet-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function depositStars(amount){
  if(window.Telegram&&window.Telegram.WebApp){
    Telegram.WebApp.sendData(JSON.stringify({action:'deposit',amount}));
  }else{
    const r=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.user_id,amount})});
    const d=await r.json();user.balance=d.balance;updateBalance();toast('+'+amount+' Stars deposited!');
  }
}

async function placeBet(){
  if(myBetPlaced)return;
  bet=parseInt(document.getElementById('bet-input').value)||0;
  if(bet<10)return toast(i18n[lang].minBet,'error');
  const ac=parseFloat(document.getElementById('auto-cashout').value)||0;
  const r=await fetch('/api/game/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.user_id,bet,auto_cashout:ac})});
  const d=await r.json();
  if(d.error)return toast(d.error,'error');
  user.balance=d.balance;updateBalance();
  myBetPlaced=true;
  updateMainBtn();
  toast(i18n[lang].betPlaced+bet+i18n[lang].stars);
}

async function cashout(){
  const r=await fetch('/api/game/cashout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.user_id})});
  const d=await r.json();
  if(d.error)return toast(d.error,'error');
  user.balance=d.balance;updateBalance();
  toast(i18n[lang].cashedOut+d.multiplier+'! '+i18n[lang].won+d.payout+i18n[lang].stars);
}

function updateMainBtn(){
  const btn=document.getElementById('main-btn');
  const t=i18n[lang];
  if(!myBetPlaced){
    btn.className='main-btn place';
    btn.innerHTML=t.placeBet+'<span class="sub">'+t.placeSub+'</span>';
    btn.onclick=placeBet;btn.disabled=false;
  }else{
    btn.className='main-btn cashout';
    btn.innerHTML=t.cashOut+'<span class="sub">'+t.cashSub+'</span>';
    btn.onclick=cashout;
  }
}

const canvas=document.getElementById('rocket-canvas');
const ctx=canvas.getContext('2d');
let bgStars=[];
for(let i=0;i<40;i++)bgStars.push({x:Math.random(),y:Math.random(),s:Math.random()+.3,b:Math.random()*6.28});

function initCanvas(){
  canvas.width=canvas.parentElement.clientWidth;
  canvas.height=canvas.parentElement.clientHeight;
}

function drawGame(mult,phase){
  const w=canvas.width,h=canvas.height;
  if(!w||!h)return;
  ctx.clearRect(0,0,w,h);

  ctx.fillStyle='#0b0b1a';ctx.fillRect(0,0,w,h);

  bgStars.forEach(s=>{
    const flick=.15+.15*Math.sin(Date.now()*.002+s.b);
    ctx.fillStyle=`rgba(255,255,255,${flick})`;
    ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.s,0,Math.PI*2);ctx.fill();
  });

  const leftPad=44,botPad=35,topPad=15,rightPad=15;
  const gw=w-leftPad-rightPad;
  const gh=h-botPad-topPad;

  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<=6;i++){
    const y=topPad+gh*(i/6);
    ctx.beginPath();ctx.moveTo(leftPad,y);ctx.lineTo(w-rightPad,y);ctx.stroke();
  }
  for(let i=0;i<=8;i++){
    const x=leftPad+gw*(i/8);
    ctx.beginPath();ctx.moveTo(x,topPad);ctx.lineTo(x,botPad);ctx.stroke();
  }

  if(phase==='betting'){
    candles=[];
    lastCandleMult=1;
    candleTimer=0;
    const cx=w*.5,cy=h*.5;
    const pulse=1+.03*Math.sin(Date.now()*.003);
    ctx.save();ctx.translate(cx,cy);ctx.scale(pulse,pulse);
    ctx.fillStyle='rgba(255,255,255,.03)';
    ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    return;
  }

  if(phase==='flying'){
    candleTimer++;
    if(candleTimer%4===0){
      const jitter=(Math.random()-.45)*mult*0.04;
      const open=lastCandleMult;
      const close=open+jitter;
      const high=Math.max(open,close)+Math.random()*mult*0.015;
      const low=Math.min(open,close)-Math.random()*mult*0.01;
      candles.push({open,close:Math.max(1,close),high,low:Math.max(1,low)});
      lastCandleMult=Math.max(1,close);
      if(candles.length>200)candles.shift();
    }
  }

  if(phase==='crashed'){
    if(candles.length>0){
      const last=candles[candles.length-1];
      last.close=mult;
      last.high=Math.max(last.high,mult);
      last.low=Math.min(last.low,mult);
    }
  }

  const allVals=candles.flatMap(c=>[c.high,c.low]);
  if(allVals.length===0)return;
  const dataMin=Math.min(...allVals)*0.98;
  const dataMax=Math.max(...allVals)*1.02;
  const range=dataMax-dataMin||1;

  ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='9px sans-serif';ctx.textAlign='right';
  for(let i=0;i<=5;i++){
    const val=dataMin+range*(i/5);
    const y=botPad-((val-dataMin)/range)*gh;
    ctx.fillText(val.toFixed(1)+'x',leftPad-4,y+3);
  }

  const candleW=Math.max(3,Math.min(12,gw/Math.max(candles.length,1)*0.7));
  const gapW=candleW*0.4;
  const totalW=candleW+gapW;
  const visibleCandles=Math.min(candles.length,Math.floor(gw/totalW));
  const startIdx=Math.max(0,candles.length-visibleCandles);
  const visible=candles.slice(startIdx);

  visible.forEach((c,i)=>{
    const x=leftPad+i*totalW;
    const yOpen=botPad-((c.open-dataMin)/range)*gh;
    const yClose=botPad-((c.close-dataMin)/range)*gh;
    const yHigh=botPad-((c.high-dataMin)/range)*gh;
    const yLow=botPad-((c.low-dataMin)/range)*gh;

    const isGreen=c.close>=c.open;
    const bodyTop=Math.min(yOpen,yClose);
    const bodyBot=Math.max(yOpen,yClose);
    const bodyH=Math.max(bodyBot-bodyTop,1);

    ctx.fillStyle=isGreen?'#00c853':'#ff1744';
    ctx.fillRect(x,bodyTop,candleW,bodyH);

    ctx.strokeStyle=isGreen?'#00c853':'#ff1744';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x+candleW/2,yHigh);
    ctx.lineTo(x+candleW/2,bodyTop);
    ctx.moveTo(x+candleW/2,bodyBot);
    ctx.lineTo(x+candleW/2,yLow);
    ctx.stroke();
  });

  if(visible.length>0){
    const last=visible[visible.length-1];
    const lx=leftPad+(visible.length-1)*totalW+candleW/2;
    const ly=botPad-((last.close-dataMin)/range)*gh;

    const pulseR=2+Math.sin(Date.now()*.005)*1;
    ctx.fillStyle='rgba(0,200,83,.2)';
    ctx.beginPath();ctx.arc(lx,ly,pulseR+4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#00c853';
    ctx.beginPath();ctx.arc(lx,ly,pulseR,0,Math.PI*2);ctx.fill();
  }
}

function updateHistory(history){
  const bar=document.getElementById('history-bar');
  bar.innerHTML='';
  history.forEach(h=>{
    const chip=document.createElement('div');
    chip.className='history-chip '+(h.mult<1.5?'low':h.mult<5?'mid':'high');
    chip.textContent=h.mult.toFixed(2)+'x';
    bar.appendChild(chip);
  });
}

function updatePlayers(players){
  const c=document.getElementById('players-container');
  c.innerHTML='';
  players.forEach((p,i)=>{
    const color=AVATAR_COLORS[i%AVATAR_COLORS.length];
    const card=document.createElement('div');
    card.className='player-card'+(p.cashed_out?' cashed':'');
    let amt='',mc='';
    if(p.cashed_out){amt='+'+p.profit;mc='win'}
    else if(gamePhase==='crashed'){amt='-'+p.bet;mc='lose'}
    card.innerHTML=`
      <div class="player-avatar" style="background:${color}">${p.username[0].toUpperCase()}</div>
      <div class="player-info">
        <div class="player-name">${p.username}</div>
        <div class="player-bet">&#11088; ${p.bet.toFixed(1)} ${p.cashed_out?'&times;'+p.cashout_mult.toFixed(2):''}</div>
      </div>
      <div>
        <div class="player-amount ${mc}">${amt?amt+' Stars':''}</div>
      </div>`;
    c.appendChild(card);
  });
}

async function pollGame(){
  try{
    const r=await fetch('/api/game/state');
    const s=await r.json();

    const md=document.getElementById('mult-display');
    const pl=document.getElementById('phase-label');
    const cr=document.getElementById('countdown-ring');

    gamePhase=s.phase;
    gameMult=s.multiplier;

    if(s.phase==='betting'){
      md.style.display='none';
      pl.style.display='none';
      cr.style.display='block';
      const offset=440-(440*(t/5));
      document.getElementById('countdown-progress').style.strokeDashoffset=offset;
      if(prevPhase!=='betting'){myBetPlaced=false;candles=[];displayMult=1;lastCandleMult=1;candleTimer=0}
      updateMainBtn();

    }else if(s.phase==='flying'){
      md.style.display='block';
      md.className='multiplier-big flying';
      md.textContent='x'+displayMult.toFixed(2);
      pl.style.display='none';
      cr.style.display='none';

    }else if(s.phase==='crashed'){
      md.style.display='block';
      md.className='multiplier-big crashed';
      md.textContent='x'+s.crash_point.toFixed(2);
      pl.style.display='none';
      cr.style.display='none';
    }

    prevPhase=s.phase;
    updateHistory(s.history);
    updatePlayers(s.players);

  }catch(e){}
}

function animate(){
  if(gamePhase==='flying'){
    displayMult+=(gameMult-displayMult)*0.25;
    if(Math.abs(gameMult-displayMult)<0.005)displayMult=gameMult;
  }else{
    displayMult=gameMult;
  }
  drawGame(displayMult,gamePhase);
  requestAnimationFrame(animate);
}

window.addEventListener('resize',initCanvas);
initCanvas();
animate();
init();
</script>
